name: profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch live numbers and render the data panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python tools/fetch_stats.py dist/stats.json || cp tools/stats.sample.json dist/stats.json
          python tools/cards.py dist/stats.json dist

      - name: generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Madmins07
          outputs: |
            dist/github-snake.svg?color_dots=#EEF1FF,#5B8CFF,#8F5CFF,#FF4FD8,#38E0FF&color_snake=#07080D
            dist/github-snake-dark.svg?color_dots=#121528,#5B8CFF,#8F5CFF,#FF4FD8,#38E0FF&color_snake=#F3F5FF

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
