name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Madmins07
          outputs: |
            dist/github-snake.svg?color_dots=#EEF1ED,#A6BDAD,#788A7F,#5A6A60,#0B0E0D&color_snake=#0B0E0D
            dist/github-snake-dark.svg?color_dots=#111614,#5A6A60,#788A7F,#A6BDAD,#EEF1ED&color_snake=#EEF1ED

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
