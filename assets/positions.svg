<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.2s" dur="0.5s" fill="freeze"/>
<rect x="96" y="113" width="60" height="20" rx="10" fill="#0E1019" stroke="#5CFFB1" stroke-opacity=".6"/><text x="126" y="127" class="mono" font-size="9.5" fill="#5CFFB1" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
