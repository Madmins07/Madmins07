<rect x="96" y="233" width="60" height="20" rx="10" fill="#0E1019" stroke="#5CFFB1" stroke-opacity=".6"/><text x="126" y="247" class="mono" font-size="9.5" fill="#5CFFB1" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
