<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A tongue in cheek blotter: long Amoh, long stochastic calculus, long the Codeforces grind, short 8 a.m. lectures">
<style>
  .sans{font-family:-apple-system,'Instrument Sans','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','Geist Mono','JetBrains Mono',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{transform-origin:center;animation:spin 40s linear infinite}
  .spinr{transform-origin:center;animation:spinr 60s linear infinite}
  .scan{animation:scan 9s linear infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(50px,-30px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-120%)}to{transform:translateY(120%)}}
</style>
<defs>
  <clipPath id="pf"><rect width="1000" height="350" rx="18"/></clipPath>
  <filter id="pglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="psoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="psoft2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#202723"/>
  </pattern>
  <linearGradient id="psage" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5A6A60"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="psagev" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A6BDAD"/><stop offset="1" stop-color="#5A6A60"/>
  </linearGradient>
  <linearGradient id="pinkfade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EEF1ED"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="phair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#788A7F" stop-opacity="0"/><stop offset=".5" stop-color="#A6BDAD"/><stop offset="1" stop-color="#788A7F" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pfadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pfadeR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#pf)">
<rect width="1000" height="350" fill="#0B0E0D"/>
<rect width="1000" height="350" fill="url(#pdots)" opacity=".55"/>
<text x="56" y="44" class="mono" font-size="10.5" fill="#788A7F" letter-spacing="2.2">POSITIONS  ·  OPEN</text>
<text x="944" y="44" class="mono" font-size="9.5" fill="#7E8781" text-anchor="end" letter-spacing="2">MARKED TO MARKET  ·  NOT INVESTMENT ADVICE</text>
<text x="56" y="76" class="mono" font-size="9.5" fill="#7E8781" letter-spacing="2">SIDE</text>
<text x="150" y="76" class="mono" font-size="9.5" fill="#7E8781" letter-spacing="2">POSITION</text>
<text x="944" y="76" class="mono" font-size="9.5" fill="#7E8781" text-anchor="end" letter-spacing="2">P&amp;L</text>
<line x1="56" y1="86" x2="944" y2="86" stroke="#202723"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.2s" dur="0.5s" fill="freeze"/>
<rect x="56" y="97" width="60" height="20" rx="10" fill="#111614" stroke="#5A6A60"/><text x="86" y="111" class="mono" font-size="9.5" fill="#A6BDAD" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
<text x="150" y="112" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">Amoh</text>
