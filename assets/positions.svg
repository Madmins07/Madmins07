<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6000000000000001s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.6000000000000001s" dur="0.5s" fill="freeze"/>
<rect x="56" y="221" width="60" height="20" rx="10" fill="#111614" stroke="#5A6A60"/><text x="86" y="235" class="mono" font-size="9.5" fill="#A6BDAD" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
<text x="150" y="236" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">K-pop during backtests</text>
<text x="331.2" y="236" class="sans" font-size="11" fill="#7E8781">inexplicable, but it works</text>
<text x="944" y="236" class="mono" font-size="13" fill="#A6BDAD" font-weight="600" text-anchor="end">▲  +64.8%</text>
<line x1="56" y1="246" x2="944" y2="246" stroke="#202723" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.7s" dur="0.5s" fill="freeze"/>
<rect x="56" y="252" width="60" height="20" rx="10" fill="#111614" stroke="#202723"/><text x="86" y="266" class="mono" font-size="9.5" fill="#7E8781" font-weight="700" text-anchor="middle" letter-spacing="1.5">SHORT</text>
<text x="150" y="267" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">8 a.m. lectures</text>
<text x="278.0" y="267" class="sans" font-size="11" fill="#7E8781">structurally impaired</text>
<text x="944" y="267" class="mono" font-size="13" fill="#7E8781" font-weight="600" text-anchor="end">▼  -71.3%</text>
<line x1="56" y1="277" x2="944" y2="277" stroke="#202723" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.8s" dur="0.5s" fill="freeze"/>
<rect x="56" y="283" width="60" height="20" rx="10" fill="#111614" stroke="#202723"/><text x="86" y="297" class="mono" font-size="9.5" fill="#7E8781" font-weight="700" text-anchor="middle" letter-spacing="1.5">SHORT</text>
<text x="150" y="298" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">Notebook outputs in git</text>
<text x="338.79999999999995" y="298" class="sans" font-size="11" fill="#7E8781">most of my repos, regrettably</text>
<text x="944" y="298" class="mono" font-size="13" fill="#7E8781" font-weight="600" text-anchor="end">▼  -44.9%</text>
<line x1="56" y1="308" x2="944" y2="308" stroke="#202723" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.9000000000000001s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.9000000000000001s" dur="0.5s" fill="freeze"/>
<rect x="56" y="314" width="60" height="20" rx="10" fill="#111614" stroke="#202723"/><text x="86" y="328" class="mono" font-size="9.5" fill="#7E8781" font-weight="700" text-anchor="middle" letter-spacing="1.5">SHORT</text>
<text x="150" y="329" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">Sleep, in exam week</text>
<text x="308.4" y="329" class="sans" font-size="11" fill="#7E8781">liquidated early</text>
<text x="944" y="329" class="mono" font-size="13" fill="#7E8781" font-weight="600" text-anchor="end">▼  -88.1%</text>
<line x1="56" y1="339" x2="944" y2="339" stroke="#202723" opacity=".7"/></g>
</g>
<rect x=".5" y=".5" width="999" height="349" rx="18" fill="none" stroke="#202723"/>
</svg>
