<rect x="96" y="293" width="60" height="20" rx="10" fill="#0E1019" stroke="#FF6E7A" stroke-opacity=".6"/><text x="126" y="307" class="mono" font-size="9.5" fill="#FF6E7A" font-weight="700" text-anchor="middle" letter-spacing="1.5">SHORT</text>
<text x="190" y="308" class="sans" font-size="14" fill="#F3F5FF" font-weight="600">Notebook outputs in git</text>
