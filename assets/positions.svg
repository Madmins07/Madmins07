<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A tongue in cheek blotter: long Amoh, long stochastic calculus, long the Codeforces grind, short 8 a.m. lectures">
<style>
  .sans{font-family:-apple-system,'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{animation:spin 40s linear infinite}
  .spinr{animation:spinr 60s linear infinite}
  .scan{animation:scan 7s linear infinite}
  .float{animation:float 6s ease-in-out infinite alternate}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,26px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(60px,-34px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-140%)}to{transform:translateY(140%)}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
</style>
<defs>
  <clipPath id="pf"><rect width="1000" height="360" rx="0"/></clipPath>
  <filter id="pglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="pglow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="psoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="pdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1C2032"/></pattern>
  <linearGradient id="pground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120b0f"/><stop offset="1" stop-color="#120d0a"/></linearGradient>
  <linearGradient id="pspine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6E7A"/><stop offset="1" stop-color="#FF9A5C"/></linearGradient>
  <linearGradient id="pspec" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#38E0FF"/><stop offset="0.33" stop-color="#8F5CFF"/><stop offset="0.67" stop-color="#FF4FD8"/><stop offset="1.00" stop-color="#FFC14D"/></linearGradient>
  <linearGradient id="pacc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6E7A"/><stop offset="1" stop-color="#FF9A5C"/></linearGradient>
  <linearGradient id="paccv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6E7A"/><stop offset="1" stop-color="#FF6E7A" stop-opacity="0"/></linearGradient>
  <linearGradient id="prule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6E7A"/><stop offset="1" stop-color="#FF6E7A" stop-opacity="0"/></linearGradient>
  <linearGradient id="phair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6E7A" stop-opacity="0"/><stop offset=".5" stop-color="#FF6E7A"/><stop offset="1" stop-color="#FF9A5C" stop-opacity="0"/></linearGradient>
  <linearGradient id="pfadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#120b0f"/><stop offset="1" stop-color="#120b0f" stop-opacity="0"/></linearGradient>
  <linearGradient id="pfadeR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#120b0f"/><stop offset="1" stop-color="#120b0f" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#pf)">
<rect width="1000" height="360" fill="url(#pground)"/>
<rect width="1000" height="360" fill="url(#pdots)" opacity=".5"/>
<ellipse cx="880" cy="330" rx="240" ry="120" fill="#FF6E7A" opacity="0.12" filter="url(#psoft)" class="drift2"/>
<rect x="39" y="0" width="2" height="360" fill="url(#pspine)" opacity=".55"/>
<circle cx="40" cy="52" r="9" fill="#07080D" stroke="#FF6E7A" stroke-width="1.5"/><circle cx="40" cy="52" r="3.5" fill="#FF6E7A" filter="url(#pglow)" class="pulse"/>
<text x="66" y="56" class="mono" font-size="11" fill="#FF6E7A" font-weight="700" letter-spacing="2">06</text>
<text x="96" y="56.5" class="mono" font-size="13.5" fill="#F3F5FF" font-weight="700" letter-spacing="2.6">POSITIONS</text>
