<text x="944" y="112" class="mono" font-size="13" fill="#A6BDAD" font-weight="600" text-anchor="end">▲  open</text>
<line x1="56" y1="122" x2="944" y2="122" stroke="#202723" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.30000000000000004s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.30000000000000004s" dur="0.5s" fill="freeze"/>
<rect x="56" y="128" width="60" height="20" rx="10" fill="#111614" stroke="#5A6A60"/><text x="86" y="142" class="mono" font-size="9.5" fill="#A6BDAD" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
<text x="150" y="143" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">Stochastic calculus</text>
<text x="308.4" y="143" class="sans" font-size="11" fill="#7E8781">Shreve, volume I, second read</text>
<text x="944" y="143" class="mono" font-size="13" fill="#A6BDAD" font-weight="600" text-anchor="end">▲  +412.6%</text>
<line x1="56" y1="153" x2="944" y2="153" stroke="#202723" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.4s" dur="0.5s" fill="freeze"/>
<rect x="56" y="159" width="60" height="20" rx="10" fill="#111614" stroke="#5A6A60"/><text x="86" y="173" class="mono" font-size="9.5" fill="#A6BDAD" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
<text x="150" y="174" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">The Codeforces grind</text>
<text x="316.0" y="174" class="sans" font-size="11" fill="#7E8781">rating goes up, eventually</text>
<text x="944" y="174" class="mono" font-size="13" fill="#A6BDAD" font-weight="600" text-anchor="end">▲  +128.4%</text>
<line x1="56" y1="184" x2="944" y2="184" stroke="#202723" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.5s" dur="0.5s" fill="freeze"/>
<rect x="56" y="190" width="60" height="20" rx="10" fill="#111614" stroke="#5A6A60"/><text x="86" y="204" class="mono" font-size="9.5" fill="#A6BDAD" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
<text x="150" y="205" class="sans" font-size="14" fill="#EEF1ED" font-weight="600">Chai at 2 a.m.</text>
<text x="270.4" y="205" class="sans" font-size="11" fill="#7E8781">the only reliable alpha</text>
<text x="944" y="205" class="mono" font-size="13" fill="#A6BDAD" font-weight="600" text-anchor="end">▲  +96.2%</text>
