<text x="944" y="158" class="mono" font-size="13" fill="#5CFFB1" font-weight="600" text-anchor="end">▲  +412.6%</text>
<line x1="96" y1="168" x2="944" y2="168" stroke="#1C2032" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.4s" dur="0.5s" fill="freeze"/>
<rect x="96" y="173" width="60" height="20" rx="10" fill="#0E1019" stroke="#5CFFB1" stroke-opacity=".6"/><text x="126" y="187" class="mono" font-size="9.5" fill="#5CFFB1" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
<text x="190" y="188" class="sans" font-size="14" fill="#F3F5FF" font-weight="600">The Codeforces grind</text>
