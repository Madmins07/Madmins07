<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.5s" dur="0.5s" fill="freeze"/>
<rect x="96" y="203" width="60" height="20" rx="10" fill="#0E1019" stroke="#5CFFB1" stroke-opacity=".6"/><text x="126" y="217" class="mono" font-size="9.5" fill="#5CFFB1" font-weight="700" text-anchor="middle" letter-spacing="1.5">LONG</text>
<text x="190" y="218" class="sans" font-size="14" fill="#F3F5FF" font-weight="600">Chai at 2 a.m.</text>
<text x="310.4" y="218" class="sans" font-size="11" fill="#6F7693">the only reliable alpha</text>
