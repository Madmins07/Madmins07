<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami. Industrial and Systems Engineering at IIT Kharagpur, class of 2028; operations at Amoh; advisor to the Kharagpur Data Analytics Group. You have a right to the work alone, never to its fruits.">
<style>
  .sans{font-family:-apple-system,'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{animation:spin 40s linear infinite}
  .spinr{animation:spinr 60s linear infinite}
  .scan{animation:scan 7s linear infinite}
  .float{animation:float 6s ease-in-out infinite alternate}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,26px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(60px,-34px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-140%)}to{transform:translateY(140%)}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
</style>
<defs>
  <clipPath id="wf"><rect width="1000" height="330" rx="0"/></clipPath>
  <filter id="wglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="wglow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="wsoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="wdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1C2032"/></pattern>
  <linearGradient id="wground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090914"/><stop offset="1" stop-color="#0a0a1a"/></linearGradient>
  <linearGradient id="wspine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient>
  <linearGradient id="wspec" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#38E0FF"/><stop offset="0.33" stop-color="#8F5CFF"/><stop offset="0.67" stop-color="#FF4FD8"/><stop offset="1.00" stop-color="#FFC14D"/></linearGradient>
  <linearGradient id="wacc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient>
  <linearGradient id="waccv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="wrule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="whair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B8CFF" stop-opacity="0"/><stop offset=".5" stop-color="#5B8CFF"/><stop offset="1" stop-color="#8F5CFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="wfadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#090914"/><stop offset="1" stop-color="#090914" stop-opacity="0"/></linearGradient>
  <linearGradient id="wfadeR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#090914"/><stop offset="1" stop-color="#090914" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#wf)">
<rect width="1000" height="330" fill="url(#wground)"/>
<rect width="1000" height="330" fill="url(#wdots)" opacity=".5"/>
<ellipse cx="880" cy="260" rx="240" ry="120" fill="#5B8CFF" opacity="0.14" filter="url(#wsoft)" class="drift2"/>
<rect x="39" y="0" width="2" height="330" fill="url(#wspine)" opacity=".55"/>
<circle cx="40" cy="52" r="9" fill="#07080D" stroke="#5B8CFF" stroke-width="1.5"/><circle cx="40" cy="52" r="3.5" fill="#5B8CFF" filter="url(#wglow)" class="pulse"/>
<text x="66" y="56" class="mono" font-size="11" fill="#5B8CFF" font-weight="700" letter-spacing="2">01</text>
<text x="96" y="56.5" class="mono" font-size="13.5" fill="#F3F5FF" font-weight="700" letter-spacing="2.6">WHOAMI</text>
<rect x="96" y="66" width="0" height="1.5" fill="url(#wrule)"><animate attributeName="width" values="0;180" begin=".3s" dur=".9s" fill="freeze"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.7s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.3s" dur="0.7s" fill="freeze"/>
<text x="96" y="100" class="sans" font-size="14.5" fill="#B9BFD6">I read Industrial &amp; Systems Engineering at IIT Kharagpur, class of 2028,</text>
<text x="96" y="121" class="sans" font-size="14.5" fill="#B9BFD6">and I run operations at Amoh, the medical AI research lab. The rest of my</text>
<text x="96" y="142" class="sans" font-size="14.5" fill="#B9BFD6">time goes where statistics meets markets: forecasting, factor research,</text>
<text x="96" y="163" class="sans" font-size="14.5" fill="#B9BFD6">optimisation, and the occasional 3 a.m. contest problem. Right now I am</text>
<text x="96" y="184" class="sans" font-size="14.5" fill="#B9BFD6">working through stochastic calculus, econometrics, and market microstructure.</text>
<text x="96" y="214" class="sans" font-size="14.5" fill="#F3F5FF" font-weight="500">I advise the Kharagpur Data Analytics Group,</text>
<text x="96" y="234" class="sans" font-size="14.5" fill="#F3F5FF" font-weight="500">having run it as Executive Head the year before.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.8s" dur="0.8s" fill="freeze"/>
<rect x="96" y="256" width="2" height="48" rx="1" fill="url(#wacc)"/><text x="112" y="274" class="sans" font-size="13.5" fill="#B9BFD6">कर्मण्येवाधिकारस्ते मा फलेषु कदाचन । मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥</text>
<text x="112" y="296" class="sans" font-size="12.5" fill="#6F7693" font-style="italic">You have a right to the work alone, never to its fruits.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.6s" dur="0.8s" fill="freeze"/>
<rect x="700" y="72" width="244" height="150" rx="14" fill="#0E1019" stroke="#1C2032"/>
<text x="718" y="100" class="mono" font-size="10.5" fill="#5B8CFF" letter-spacing="2.2">NOW</text>
<text x="718" y="128" class="mono" font-size="10.5" fill="#6F7693" letter-spacing="1.2">reading</text>
<text x="796" y="128" class="sans" font-size="12.5" fill="#F3F5FF" font-weight="500">Shreve, volume I</text>
<text x="718" y="152" class="mono" font-size="10.5" fill="#6F7693" letter-spacing="1.2">building</text>
<text x="796" y="152" class="sans" font-size="12.5" fill="#F3F5FF" font-weight="500">Amoh operations</text>
<text x="718" y="176" class="mono" font-size="10.5" fill="#6F7693" letter-spacing="1.2">solving</text>
<text x="796" y="176" class="sans" font-size="12.5" fill="#F3F5FF" font-weight="500">Codeforces, Div 2 C</text>
<text x="718" y="200" class="mono" font-size="10.5" fill="#6F7693" letter-spacing="1.2">listening</text>
<text x="796" y="200" class="sans" font-size="12.5" fill="#F3F5FF" font-weight="500">Sukoon</text>
</g>
</g>
</svg>
