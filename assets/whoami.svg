<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami. Industrial and Systems Engineering at IIT Kharagpur, class of 2028; operations at Amoh; advisor to the Kharagpur Data Analytics Group. You have a right to the work alone, never to its fruits.">
<style>
  .sans{font-family:-apple-system,'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}
  .blink{animation:blink 1.2s step-end infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
</style>
<defs>
  <clipPath id="wf"><rect width="1000" height="280" rx="0"/></clipPath>
  <pattern id="wdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1F232B"/></pattern>
</defs>
<g clip-path="url(#wf)">
<rect width="1000" height="280" fill="#0A0B0E"/>
<rect width="1000" height="280" fill="url(#wdots)" opacity=".45"/>
<rect x="39.5" y="0" width="1" height="280" fill="#2A2F39"/>
<rect x="36" y="48" width="8" height="8" fill="#FF7A1A"/>
<text x="66" y="56" class="mono" font-size="11" fill="#FF7A1A" font-weight="700" letter-spacing="2">01</text>
<text x="88" y="56.5" class="mono" font-size="13" fill="#F4F5F7" font-weight="700" letter-spacing="3">WHOAMI</text>
<line x1="88" y1="74" x2="944" y2="74" stroke="#1F232B" opacity="1"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.25s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.25s" dur="0.6s" fill="freeze"/>
<text x="88" y="106" class="sans" font-size="14" fill="#AEB4BF">I read Industrial &amp; Systems Engineering at IIT Kharagpur, class of 2028, and I run</text>
<text x="88" y="126" class="sans" font-size="14" fill="#AEB4BF">operations at Amoh, the medical AI research lab. The rest of my time goes where</text>
<text x="88" y="146" class="sans" font-size="14" fill="#AEB4BF">statistics meets markets: forecasting, factor research, optimisation, and the</text>
<text x="88" y="166" class="sans" font-size="14" fill="#AEB4BF">occasional 3 a.m. contest problem. Right now: stochastic calculus, econometrics,</text>
<text x="88" y="186" class="sans" font-size="14" fill="#AEB4BF">and market microstructure. I advise the Kharagpur Data Analytics Group, having</text>
<text x="88" y="206" class="sans" font-size="14" fill="#AEB4BF">run it as Executive Head the year before.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.7s" dur="0.55s" fill="freeze"/>
<rect x="88" y="228" width="2" height="34" fill="#FF7A1A"/><text x="102" y="242" class="sans" font-size="12.5" fill="#AEB4BF">कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।</text>
<text x="102" y="258" class="sans" font-size="11.5" fill="#6A7280" font-style="italic">You have a right to the work alone, never to its fruits.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.5s" dur="0.55s" fill="freeze"/>
<text x="700" y="106" class="mono" font-size="10" fill="#6A7280" letter-spacing="2.4">READING</text>
<text x="944" y="106" class="sans" font-size="12.5" fill="#F4F5F7" font-weight="500" text-anchor="end">Shreve, Stochastic Calculus I</text>
<line x1="700" y1="117" x2="944" y2="117" stroke="#1F232B" opacity="1"/>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.58s" dur="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.58s" dur="0.55s" fill="freeze"/>
<text x="700" y="136" class="mono" font-size="10" fill="#6A7280" letter-spacing="2.4">BUILDING</text>
<text x="944" y="136" class="sans" font-size="12.5" fill="#F4F5F7" font-weight="500" text-anchor="end">Amoh operations</text>
<line x1="700" y1="147" x2="944" y2="147" stroke="#1F232B" opacity="1"/>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.66s" dur="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.66s" dur="0.55s" fill="freeze"/>
<text x="700" y="166" class="mono" font-size="10" fill="#6A7280" letter-spacing="2.4">SOLVING</text>
<text x="944" y="166" class="sans" font-size="12.5" fill="#F4F5F7" font-weight="500" text-anchor="end">Codeforces, Div 2 C</text>
<line x1="700" y1="177" x2="944" y2="177" stroke="#1F232B" opacity="1"/>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.74s" dur="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.74s" dur="0.55s" fill="freeze"/>
<text x="700" y="196" class="mono" font-size="10" fill="#6A7280" letter-spacing="2.4">LISTENING</text>
<text x="944" y="196" class="sans" font-size="12.5" fill="#F4F5F7" font-weight="500" text-anchor="end">Sukoon</text>
<line x1="700" y1="207" x2="944" y2="207" stroke="#1F232B" opacity="1"/>
</g>
</g>
</svg>
