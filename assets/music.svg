<svg width="1000" height="160" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apple Music player card cycling through Madhav's playlists">
<style>
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:ui-sans-serif,-apple-system,'Helvetica Neue','Segoe UI',Arial,sans-serif}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<defs>
  <clipPath id="mFrame"><rect width="1000" height="160" rx="16"/></clipPath>
  <clipPath id="artClip"><rect x="28" y="26" width="108" height="108" rx="14"/></clipPath>
  <linearGradient id="artG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fa2d48"/><stop offset="0.55" stop-color="#e0507a"/><stop offset="1" stop-color="#8a5cf0"/>
  </linearGradient>
  <linearGradient id="fadeTrack" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e0b170"/><stop offset="1" stop-color="#fa2d48"/>
  </linearGradient>
</defs>

<g clip-path="url(#mFrame)">
  <rect width="1000" height="160" fill="#0b0d10"/>

  <!-- album art -->
  <g clip-path="url(#artClip)">
    <rect x="28" y="26" width="108" height="108" fill="url(#artG)"/>
    <circle cx="82" cy="80" r="34" fill="#000000" opacity="0.18">
      <animate attributeName="r" values="34;40;34" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g fill="#ffffff" opacity="0.92">
      <circle cx="70" cy="94" r="7"/><circle cx="96" cy="88" r="7"/>
      <rect x="75" y="62" width="3.4" height="32" rx="1.7"/>
      <rect x="101" y="56" width="3.4" height="32" rx="1.7"/>
      <path d="M75,62 L104,56 L104,64 L75,70 Z"/>
    </g>
  </g>
  <rect x="28.5" y="26.5" width="107" height="107" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- now playing label -->
  <circle cx="164" cy="47" r="4" fill="#fa2d48" class="pulse"/>
  <text x="178" y="51" class="mono" font-size="11" fill="#7d8794" letter-spacing="2.2">NOW PLAYING</text>
  <text x="964" y="51" text-anchor="end" class="sans" font-size="13" font-weight="600" fill="#8b93a1">Apple Music</text>

  <!-- cycling tracks -->
  <g>
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="28s" repeatCount="indefinite"/>
      <text x="164" y="88" class="sans" font-size="25" font-weight="700" fill="#f0eae0">Sukoon</text>
      <text x="164" y="112" class="sans" font-size="14" fill="#7d8794">the late-desk playlist</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.26;0.49;0.50;1" dur="28s" repeatCount="indefinite"/>
      <text x="164" y="88" class="sans" font-size="25" font-weight="700" fill="#f0eae0">Calm Synths</text>
      <text x="164" y="112" class="sans" font-size="14" fill="#7d8794">for long proofs and longer backtests</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.51;0.74;0.75;1" dur="28s" repeatCount="indefinite"/>
      <text x="164" y="88" class="sans" font-size="25" font-weight="700" fill="#f0eae0">K-pop</text>
      <text x="164" y="112" class="sans" font-size="14" fill="#7d8794">non negotiable</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.76;1" dur="28s" repeatCount="indefinite"/>
      <text x="164" y="88" class="sans" font-size="25" font-weight="700" fill="#f0eae0">EDM</text>
      <text x="164" y="112" class="sans" font-size="14" fill="#7d8794">contest mode</text>
    </g>
  </g>

  <!-- progress -->
  <rect x="164" y="128" width="654" height="4" rx="2" fill="#1c2128"/>
  <rect x="164" y="128" width="0" height="4" rx="2" fill="url(#fadeTrack)">
    <animate attributeName="width" values="0;654" dur="7s" repeatCount="indefinite"/>
  </rect>
  <circle cy="130" r="5" fill="#f0eae0">
    <animate attributeName="cx" values="164;818" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- equalizer -->
  <g fill="#e0b170">
    <rect x="856" y="86" width="5" height="26" rx="2.5">
      <animate attributeName="height" values="26;9;22;12;26" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="86;103;90;100;86" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="870" y="78" width="5" height="34" rx="2.5">
      <animate attributeName="height" values="34;14;30;10;34" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="78;98;82;102;78" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="884" y="90" width="5" height="22" rx="2.5">
      <animate attributeName="height" values="22;34;12;28;22" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;78;100;84;90" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="898" y="82" width="5" height="30" rx="2.5">
      <animate attributeName="height" values="30;11;26;16;30" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="82;101;86;96;82" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="912" y="94" width="5" height="18" rx="2.5">
      <animate attributeName="height" values="18;31;13;25;18" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="94;81;99;87;94" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="926" y="86" width="5" height="26" rx="2.5">
      <animate attributeName="height" values="26;13;30;10;26" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="86;99;82;102;86" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="940" y="90" width="5" height="22" rx="2.5">
      <animate attributeName="height" values="22;33;14;27;22" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;79;98;85;90" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
<rect x="0.5" y="0.5" width="999" height="159" rx="16" fill="none" stroke="#1c2128"/>
</svg>
