<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill allocation: Python, C++, machine learning, time series and econometrics, quantitative methods">
<style>
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:ui-sans-serif,-apple-system,'Helvetica Neue','Segoe UI',Arial,sans-serif}
</style>
<defs>
  <clipPath id="sFrame"><rect width="1000" height="330" rx="16"/></clipPath>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c98f4a"/><stop offset="1" stop-color="#e8c68d"/>
  </linearGradient>
</defs>

<g clip-path="url(#sFrame)">
  <rect width="1000" height="330" fill="#0b0d10"/>

  <text x="44" y="52" class="mono" font-size="12" fill="#7d8794" letter-spacing="2.6">ALLOCATION</text>
  <text x="956" y="52" text-anchor="end" class="mono" font-size="11" fill="#4d5661" letter-spacing="1.4">HIGH CONVICTION, REBALANCED OFTEN</text>
  <line x1="44" y1="68" x2="956" y2="68" stroke="#1c2128"/>

  <!-- Python -->
  <text x="44" y="106" class="sans" font-size="17" font-weight="600" fill="#f0eae0">Python</text>
  <text x="44" y="126" class="sans" font-size="12.5" fill="#6c7683">research, modelling, most things</text>
  <rect x="330" y="98" width="480" height="8" rx="4" fill="#141920"/>
  <rect x="330" y="98" width="0" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="0;480" begin="0.2s" dur="1.1s" fill="freeze"/>
  </rect>
  <text x="956" y="107" text-anchor="end" class="mono" font-size="14" fill="#e0b170">32%</text>

  <!-- C++ -->
  <text x="44" y="162" class="sans" font-size="17" font-weight="600" fill="#f0eae0">C++</text>
  <text x="44" y="182" class="sans" font-size="12.5" fill="#6c7683">contests, and anything that has to be fast</text>
  <rect x="330" y="154" width="480" height="8" rx="4" fill="#141920"/>
  <rect x="330" y="154" width="0" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="0;330" begin="0.35s" dur="1.1s" fill="freeze"/>
  </rect>
  <text x="956" y="163" text-anchor="end" class="mono" font-size="14" fill="#e0b170">22%</text>

  <!-- ML -->
  <text x="44" y="218" class="sans" font-size="17" font-weight="600" fill="#f0eae0">Machine learning</text>
  <text x="44" y="238" class="sans" font-size="12.5" fill="#6c7683">PyTorch, TensorFlow, scikit-learn</text>
  <rect x="330" y="210" width="480" height="8" rx="4" fill="#141920"/>
  <rect x="330" y="210" width="0" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="0;270" begin="0.5s" dur="1.1s" fill="freeze"/>
  </rect>
  <text x="956" y="219" text-anchor="end" class="mono" font-size="14" fill="#e0b170">18%</text>

  <!-- Time series -->
  <text x="44" y="274" class="sans" font-size="17" font-weight="600" fill="#f0eae0">Time series</text>
  <text x="44" y="294" class="sans" font-size="12.5" fill="#6c7683">forecasting, econometrics, stationarity</text>
  <rect x="330" y="266" width="480" height="8" rx="4" fill="#141920"/>
  <rect x="330" y="266" width="0" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="0;240" begin="0.65s" dur="1.1s" fill="freeze"/>
  </rect>
  <text x="956" y="275" text-anchor="end" class="mono" font-size="14" fill="#e0b170">16%</text>
</g>
<rect x="0.5" y="0.5" width="999" height="329" rx="16" fill="none" stroke="#1c2128"/>
</svg>
