<svg width="1000" height="384" viewBox="0 0 1000 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill allocation: Python, C++, machine learning, time series, quantitative methods">
<style>
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:ui-sans-serif,-apple-system,'Helvetica Neue','Segoe UI',Arial,sans-serif}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<defs>
  <clipPath id="sFrame"><rect width="1000" height="384" rx="16"/></clipPath>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b07f3d"/><stop offset="1" stop-color="#f0cf95"/>
  </linearGradient>
</defs>
<g clip-path="url(#sFrame)">
  <rect width="1000" height="384" fill="#0b0d10"/>
  <rect width="1000" height="40" fill="#0e1116"/>
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#1c2128"/>
  <circle cx="26" cy="20" r="4" fill="#79d4a7" class="pulse"/>
  <text x="42" y="25" class="mono" font-size="12" font-weight="bold" fill="#e0b170" letter-spacing="1.4">ALLOCATION · SKILL PORTFOLIO</text>
  <text x="956" y="25" text-anchor="end" class="mono" font-size="11" fill="#5f6875" letter-spacing="1.2">RISK: HIGH CONVICTION · REBALANCED OFTEN</text>

  <text x="44" y="72" class="mono" font-size="10.5" fill="#3f4854" letter-spacing="1.8">ASSET</text>
  <text x="330" y="72" class="mono" font-size="10.5" fill="#3f4854" letter-spacing="1.8">WEIGHT</text>
  <text x="824" y="72" class="mono" font-size="10.5" fill="#3f4854" letter-spacing="1.8">P&amp;L</text>

  <text x="44" y="104" class="mono" font-size="14" font-weight="bold" fill="#e0b170">PYTHON</text>
  <text x="44" y="120" class="sans" font-size="11.5" fill="#5f6875">research, modelling, most things</text>
  <rect x="330" y="93" width="460" height="11" rx="5.5" fill="#141920" stroke="#1c2128"/>
