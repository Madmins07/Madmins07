    <animate attributeName="width" values="0;460.0" begin="0.25s" dur="1s" fill="freeze"/></rect>
  <text x="824" y="104" class="mono" font-size="14" fill="#e8e2d8">32%</text>
  <text x="872" y="104" class="mono" font-size="14" fill="#79d4a7">▲</text><text x="44" y="160" class="mono" font-size="14" font-weight="bold" fill="#e0b170">C++</text>
  <text x="44" y="176" class="sans" font-size="11.5" fill="#5f6875">contests, and anything that has to be fast</text>
  <rect x="330" y="149" width="460" height="11" rx="5.5" fill="#141920" stroke="#1c2128"/>
  <rect x="330" y="149" width="0" height="11" rx="5.5" fill="url(#bar)">
    <animate attributeName="width" values="0;316.2" begin="0.39s" dur="1s" fill="freeze"/></rect>
  <text x="824" y="160" class="mono" font-size="14" fill="#e8e2d8">22%</text>
  <text x="872" y="160" class="mono" font-size="14" fill="#79d4a7">▲</text><text x="44" y="216" class="mono" font-size="14" font-weight="bold" fill="#e0b170">MACHINE LEARNING</text>
  <text x="44" y="232" class="sans" font-size="11.5" fill="#5f6875">PyTorch, TensorFlow, scikit-learn</text>
  <rect x="330" y="205" width="460" height="11" rx="5.5" fill="#141920" stroke="#1c2128"/>
  <rect x="330" y="205" width="0" height="11" rx="5.5" fill="url(#bar)">
    <animate attributeName="width" values="0;258.8" begin="0.53s" dur="1s" fill="freeze"/></rect>
  <text x="824" y="216" class="mono" font-size="14" fill="#e8e2d8">18%</text>
  <text x="872" y="216" class="mono" font-size="14" fill="#79d4a7">▲</text><text x="44" y="272" class="mono" font-size="14" font-weight="bold" fill="#e0b170">TIME SERIES</text>
  <text x="44" y="288" class="sans" font-size="11.5" fill="#5f6875">forecasting, econometrics, stationarity</text>
  <rect x="330" y="261" width="460" height="11" rx="5.5" fill="#141920" stroke="#1c2128"/>
  <rect x="330" y="261" width="0" height="11" rx="5.5" fill="url(#bar)">
    <animate attributeName="width" values="0;230.0" begin="0.67s" dur="1s" fill="freeze"/></rect>
  <text x="824" y="272" class="mono" font-size="14" fill="#e8e2d8">16%</text>
  <text x="872" y="272" class="mono" font-size="14" fill="#79d4a7">▲</text><text x="44" y="328" class="mono" font-size="14" font-weight="bold" fill="#e0b170">QUANT METHODS</text>
  <text x="44" y="344" class="sans" font-size="11.5" fill="#5f6875">stochastic calculus, optimisation</text>
  <rect x="330" y="317" width="460" height="11" rx="5.5" fill="#141920" stroke="#1c2128"/>
  <rect x="330" y="317" width="0" height="11" rx="5.5" fill="url(#bar)">
    <animate attributeName="width" values="0;172.5" begin="0.81s" dur="1s" fill="freeze"/></rect>
  <text x="824" y="328" class="mono" font-size="14" fill="#e8e2d8">12%</text>
  <text x="872" y="328" class="mono" font-size="14" fill="#79d4a7">▲</text>
</g>
<rect x="0.5" y="0.5" width="999" height="383" rx="16" fill="none" stroke="#1c2128"/>
</svg>