</g>
<rect x="66" y="194" width="0" height="2" fill="url(#hspec)"><animate attributeName="width" values="0;420" begin=".9s" dur="1.1s" fill="freeze"/></rect>
<text x="66" y="232" class="sans" font-size="18" fill="#F3F5FF" opacity="0">Operations at Amoh, the medical AI research lab.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="1.2s" repeatCount="indefinite"/></text>
<text x="66" y="232" class="sans" font-size="18" fill="#F3F5FF" opacity="0">Quant research. Time series. Optimisation.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="5.4s" repeatCount="indefinite"/></text>
<text x="66" y="232" class="sans" font-size="18" fill="#F3F5FF" opacity="0">Advisor, Kharagpur Data Analytics Group.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="9.6s" repeatCount="indefinite"/></text>
<text x="66" y="232" class="sans" font-size="18" fill="#F3F5FF" opacity="0">Codeforces Specialist. Problems after midnight.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="13.8s" repeatCount="indefinite"/></text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1.0s" dur="0.8s" fill="freeze"/>
<text x="66" y="268" class="sans" font-size="13.5" fill="#B9BFD6">Building the infrastructure that lets models do real clinical work.</text>
<text x="66" y="288" class="sans" font-size="13.5" fill="#6F7693">Reading stochastic calculus on the side. Shipping on the other side.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.5s" dur="0.8s" fill="freeze"/>
