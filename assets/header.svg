<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Madhav Agarwal, Industrial and Systems Engineering at IIT Kharagpur, class of 2028, Advisor at Kharagpur Data Analytics Group">
<style>
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:ui-sans-serif,-apple-system,'Helvetica Neue','Segoe UI',Arial,sans-serif}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<defs>
  <clipPath id="hFrame"><rect width="1000" height="300" rx="16"/></clipPath>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d3122"/>
    <stop offset="1" stop-color="#0b0d10"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e0b170"/><stop offset="1" stop-color="#0b0d10"/>
  </linearGradient>
</defs>

<g clip-path="url(#hFrame)">
  <rect width="1000" height="300" fill="#0b0d10"/>

  <!-- eyebrow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.15s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.15s" dur="0.6s" fill="freeze"/>
    <circle cx="58" cy="66" r="4" fill="#79d4a7" class="pulse"/>
    <text x="72" y="70" class="mono" font-size="11.5" fill="#7d8794" letter-spacing="1.8">IIT KHARAGPUR · INDUSTRIAL &amp; SYSTEMS ENGINEERING · CLASS OF 2028</text>
  </g>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.35s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.35s" dur="0.7s" fill="freeze"/>
    <text x="56" y="132" class="sans" font-size="52" font-weight="700" fill="#f0eae0" letter-spacing="-1">Madhav Agarwal</text>
  </g>

  <!-- rule -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.6s" fill="freeze"/>
    <rect x="56" y="152" width="0" height="2" rx="1" fill="url(#rule)">
      <animate attributeName="width" values="0;300" begin="0.6s" dur="0.9s" fill="freeze"/>
    </rect>
  </g>

  <!-- roles -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.8s" dur="0.7s" fill="freeze"/>
    <text x="56" y="188" class="sans" font-size="19" fill="#e0b170">Advisor, Kharagpur Data Analytics Group</text>
    <text x="56" y="216" class="sans" font-size="16" fill="#9aa4b2">Quantitative finance · Machine learning · Time series · Operations research</text>
  </g>

  <!-- chips -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.05s" dur="0.7s" fill="freeze"/>
    <rect x="56" y="240" width="150" height="26" rx="13" fill="none" stroke="#2a3038"/>
    <text x="131" y="257" text-anchor="middle" class="mono" font-size="11" fill="#79d4a7" letter-spacing="1.2">WORLDQUANT GOLD</text>
    <rect x="214" y="240" width="122" height="26" rx="13" fill="none" stroke="#2a3038"/>
    <text x="275" y="257" text-anchor="middle" class="mono" font-size="11" fill="#7fb8f0" letter-spacing="1.2">KOLKATA, IN</text>
    <rect x="344" y="240" width="132" height="26" rx="13" fill="none" stroke="#2a3038"/>
    <text x="410" y="257" text-anchor="middle" class="mono" font-size="11" fill="#e0b170" letter-spacing="1.2">CODEFORCES</text>
  </g>

  <!-- sparkline panel -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.9s" fill="freeze"/>
    <line x1="600" y1="112" x2="948" y2="112" stroke="#161b21"/>
    <line x1="600" y1="160" x2="948" y2="160" stroke="#161b21"/>
    <line x1="600" y1="208" x2="948" y2="208" stroke="#161b21"/>

    <path d="M600,206 L622,198 L644,203 L666,189 L688,179 L710,185 L732,170 L754,157
             L776,163 L798,148 L820,135 L842,141 L864,123 L886,111 L908,117 L930,96
             L930,232 L600,232 Z" fill="url(#area)" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.5s" dur="1s" fill="freeze"/>
    </path>

    <polyline points="600,206 622,198 644,203 666,189 688,179 710,185 732,170 754,157
                      776,163 798,148 820,135 842,141 864,123 886,111 908,117 930,96"
              fill="none" stroke="#e0b170" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
              stroke-dasharray="460" stroke-dashoffset="460">
      <animate attributeName="stroke-dashoffset" values="460;0" begin="0.7s" dur="2.2s" fill="freeze"/>
    </polyline>

    <circle cx="930" cy="96" r="4.5" fill="#e0b170" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="2.9s" dur="0.4s" fill="freeze"/>
    </circle>
    <circle cx="930" cy="96" r="4.5" fill="none" stroke="#e0b170" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" begin="3.1s" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.5;13" begin="3.1s" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <text x="948" y="90" text-anchor="end" class="mono" font-size="11" fill="#4d5661" letter-spacing="1.6">CURIOSITY, CUMULATIVE</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#1c2128"/>
</svg>
