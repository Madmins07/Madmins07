<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Madhav Agarwal. Operations at Amoh, the medical AI research lab. Industrial and Systems Engineering, IIT Kharagpur, class of 2028.">
<style>
  .sans{font-family:-apple-system,'Instrument Sans','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','Geist Mono','JetBrains Mono',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{transform-origin:center;animation:spin 40s linear infinite}
  .spinr{transform-origin:center;animation:spinr 60s linear infinite}
  .scan{animation:scan 9s linear infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(50px,-30px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-120%)}to{transform:translateY(120%)}}
</style>
<defs>
  <clipPath id="hf"><rect width="1000" height="400" rx="18"/></clipPath>
  <filter id="hglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="hsoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="hsoft2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="hdots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#202723"/>
  </pattern>
  <linearGradient id="hsage" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5A6A60"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="hsagev" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A6BDAD"/><stop offset="1" stop-color="#5A6A60"/>
  </linearGradient>
  <linearGradient id="hinkfade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EEF1ED"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="hhair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#788A7F" stop-opacity="0"/><stop offset=".5" stop-color="#A6BDAD"/><stop offset="1" stop-color="#788A7F" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hfadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hfadeR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#hf)">
<rect width="1000" height="400" fill="#0B0E0D"/>
<rect width="1000" height="400" fill="url(#hdots)" opacity=".55"/>
<ellipse cx="790" cy="120" rx="260" ry="150" fill="#788A7F" opacity="0.22" filter="url(#hsoft)" class="drift"/>
<ellipse cx="160" cy="420" rx="300" ry="110" fill="#5A6A60" opacity="0.2" filter="url(#hsoft)" class="drift2"/>
<rect x="0" y="300" width="1000" height="1" fill="url(#hhair)"/>
<rect x="0" y="0" width="1000" height="60" fill="url(#hsagev)" opacity=".035" class="scan"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.1s" dur="0.6s" fill="freeze"/>
<text x="56" y="90" class="mono" font-size="10.5" fill="#788A7F" letter-spacing="2.2">MADHAV AGARWAL   ·   IIT KHARAGPUR &#x27;28   ·   KOLKATA</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.3s" dur="0.8s" fill="freeze"/>
<text x="56" y="152" class="sans" font-size="60" fill="url(#hinkfade)" font-weight="700" letter-spacing="-2.4">Madhav Agarwal</text>
</g>
<rect x="56" y="170" width="0" height="1.5" fill="url(#hsage)"><animate attributeName="width" values="0;300" begin=".8s" dur="1s" fill="freeze"/></rect>
<text x="56" y="206" class="sans" font-size="17.5" fill="#C2C9C3" opacity="0">Operations at Amoh, the medical AI research lab.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="1.2s" repeatCount="indefinite"/></text>
<text x="56" y="206" class="sans" font-size="17.5" fill="#C2C9C3" opacity="0">Quant research. Time series. Optimisation.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="5.4s" repeatCount="indefinite"/></text>
<text x="56" y="206" class="sans" font-size="17.5" fill="#C2C9C3" opacity="0">Advisor, Kharagpur Data Analytics Group.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="9.6s" repeatCount="indefinite"/></text>
<text x="56" y="206" class="sans" font-size="17.5" fill="#C2C9C3" opacity="0">Codeforces Specialist. Problems after midnight.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.2;.24;1" dur="16.8s" begin="13.8s" repeatCount="indefinite"/></text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1.0s" dur="0.8s" fill="freeze"/>
<text x="56" y="244" class="sans" font-size="13.5" fill="#7E8781">Building the infrastructure that lets models do real clinical work.</text>
<text x="56" y="264" class="sans" font-size="13.5" fill="#7E8781">Reading stochastic calculus on the side.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.5s" dur="0.8s" fill="freeze"/>
