<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin="0.3s" dur="0.9s" fill="freeze"/>
