<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Madhav Agarwal. Operations at Amoh, the medical AI research lab. Industrial and Systems Engineering, IIT Kharagpur, class of 2028.">
<style>
  .sans{font-family:-apple-system,'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{animation:spin 40s linear infinite}
  .spinr{animation:spinr 60s linear infinite}
  .scan{animation:scan 7s linear infinite}
  .float{animation:float 6s ease-in-out infinite alternate}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,26px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(60px,-34px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-140%)}to{transform:translateY(140%)}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
</style>
<defs>
  <clipPath id="hf"><rect width="1000" height="440" rx="0"/></clipPath>
  <filter id="hglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="hglow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="hsoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="hdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1C2032"/></pattern>
  <linearGradient id="hground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#090914"/></linearGradient>
  <linearGradient id="hspine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#5B8CFF"/></linearGradient>
  <linearGradient id="hspec" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#38E0FF"/><stop offset="0.33" stop-color="#8F5CFF"/><stop offset="0.67" stop-color="#FF4FD8"/><stop offset="1.00" stop-color="#FFC14D"/></linearGradient>
  <linearGradient id="hacc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#5B8CFF"/></linearGradient>
  <linearGradient id="haccv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#38E0FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="hrule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#38E0FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="hhair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38E0FF" stop-opacity="0"/><stop offset=".5" stop-color="#38E0FF"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="hfadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#07080d" stop-opacity="0"/></linearGradient>
  <linearGradient id="hfadeR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#07080d" stop-opacity="0"/></linearGradient>
</defs>
