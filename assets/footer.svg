<svg width="1000" height="160" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The market closes. Curiosity does not.">
<style>
  .sans{font-family:-apple-system,'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{animation:spin 40s linear infinite}
  .spinr{animation:spinr 60s linear infinite}
  .scan{animation:scan 7s linear infinite}
  .float{animation:float 6s ease-in-out infinite alternate}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,26px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(60px,-34px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-140%)}to{transform:translateY(140%)}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
</style>
<defs>
  <clipPath id="ff"><rect width="1000" height="160" rx="0"/></clipPath>
  <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fglow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fsoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="fdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1C2032"/></pattern>
  <linearGradient id="fground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070c0e"/><stop offset="1" stop-color="#07080d"/></linearGradient>
  <linearGradient id="fspine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#38E0FF"/></linearGradient>
  <linearGradient id="fspec" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#38E0FF"/><stop offset="0.33" stop-color="#8F5CFF"/><stop offset="0.67" stop-color="#FF4FD8"/><stop offset="1.00" stop-color="#FFC14D"/></linearGradient>
  <linearGradient id="facc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#38E0FF"/></linearGradient>
  <linearGradient id="faccv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#38E0FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38E0FF"/><stop offset="1" stop-color="#38E0FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="fhair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38E0FF" stop-opacity="0"/><stop offset=".5" stop-color="#38E0FF"/><stop offset="1" stop-color="#38E0FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="ffadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070c0e"/><stop offset="1" stop-color="#070c0e" stop-opacity="0"/></linearGradient>
  <linearGradient id="ffadeR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#070c0e"/><stop offset="1" stop-color="#070c0e" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#ff)">
<rect width="1000" height="160" fill="url(#fground)"/>
<rect width="1000" height="160" fill="url(#fdots)" opacity=".5"/>
<ellipse cx="500" cy="170" rx="320" ry="70" fill="#38E0FF" opacity="0.16" filter="url(#fsoft)" class="drift"/>
<rect x="39" y="0" width="2" height="60" fill="url(#fspine)" opacity=".55"/><circle cx="40" cy="64" r="3.5" fill="#38E0FF" filter="url(#fglow)"/>
<rect x="300" y="50" width="400" height="1" fill="url(#fhair)"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.2s" dur="0.9s" fill="freeze"/>
<text x="500" y="92" class="sans" font-size="22" fill="url(#fspec)" font-weight="600" text-anchor="middle" letter-spacing="-.5" font-style="italic">the market closes. curiosity doesn&#x27;t.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.6s" dur="0.6s" fill="freeze"/>
<text x="470" y="124" class="mono" font-size="10.5" fill="#6F7693" text-anchor="end" letter-spacing="2">SESSION PERSISTS</text>
<circle cx="486" cy="120" r="3.2" fill="#5CFFB1" class="blink"/><text x="500" y="124" class="mono" font-size="10.5" fill="#6F7693" letter-spacing="2">KOLKATA, IN</text>
</g>
</g>
</svg>
