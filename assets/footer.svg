<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The market closes. Curiosity does not.">
<style>
  .sans{font-family:-apple-system,'Instrument Sans','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','Geist Mono','JetBrains Mono',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{transform-origin:center;animation:spin 40s linear infinite}
  .spinr{transform-origin:center;animation:spinr 60s linear infinite}
  .scan{animation:scan 9s linear infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(50px,-30px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-120%)}to{transform:translateY(120%)}}
</style>
<defs>
  <clipPath id="ff"><rect width="1000" height="150" rx="18"/></clipPath>
  <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fsoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="fsoft2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="fdots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#202723"/>
  </pattern>
  <linearGradient id="fsage" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5A6A60"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="fsagev" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A6BDAD"/><stop offset="1" stop-color="#5A6A60"/>
  </linearGradient>
  <linearGradient id="finkfade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EEF1ED"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="fhair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#788A7F" stop-opacity="0"/><stop offset=".5" stop-color="#A6BDAD"/><stop offset="1" stop-color="#788A7F" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ffadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ffadeR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#ff)">
<rect width="1000" height="150" fill="#0B0E0D"/>
<rect width="1000" height="150" fill="url(#fdots)" opacity=".55"/>
<ellipse cx="500" cy="160" rx="300" ry="70" fill="#5A6A60" opacity="0.2" filter="url(#fsoft)" class="drift"/>
<rect x="300" y="44" width="400" height="1" fill="url(#fhair)"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.2s" dur="0.9s" fill="freeze"/>
<text x="500" y="86" class="sans" font-size="22" fill="#A6BDAD" font-weight="500" text-anchor="middle" letter-spacing="-.5" font-style="italic">the market closes. curiosity doesn&#x27;t.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.6s" dur="0.6s" fill="freeze"/>
<text x="470" y="118" class="mono" font-size="10.5" fill="#7E8781" text-anchor="end" letter-spacing="2">SESSION PERSISTS</text>
<circle cx="486" cy="114" r="3.2" fill="#A6BDAD" class="blink"/><text x="500" y="118" class="mono" font-size="10.5" fill="#7E8781" letter-spacing="2">KOLKATA, IN</text>
</g>
</g>
<rect x=".5" y=".5" width="999" height="149" rx="18" fill="none" stroke="#202723"/>
</svg>
