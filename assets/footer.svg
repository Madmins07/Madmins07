<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The market closes. Curiosity does not.">
<style>
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:ui-sans-serif,-apple-system,'Helvetica Neue','Segoe UI',Arial,sans-serif}
  .blink{animation:blink 1.6s step-end infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
</style>
<defs>
  <clipPath id="fFrame"><rect width="1000" height="140" rx="16"/></clipPath>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0b0d10"/>
    <stop offset="0.5" stop-color="#8d6f45"/>
    <stop offset="1" stop-color="#0b0d10"/>
  </linearGradient>
</defs>

<g clip-path="url(#fFrame)">
  <rect width="1000" height="140" fill="#0b0d10"/>

  <rect x="300" y="42" width="400" height="1" fill="url(#hair)"/>

  <text x="500" y="82" text-anchor="middle" class="sans" font-size="21" font-style="italic" fill="#e0b170">
    the market closes. curiosity doesn&#39;t.
  </text>

  <g>
    <text x="474" y="112" text-anchor="end" class="mono" font-size="11.5" fill="#6c7683" letter-spacing="1.2">SESSION PERSISTS</text>
    <circle cx="486" cy="108" r="3.4" fill="#79d4a7" class="blink"/>
    <text x="498" y="112" class="mono" font-size="11.5" fill="#6c7683" letter-spacing="1.2">KOLKATA, IN</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="999" height="139" rx="16" fill="none" stroke="#1c2128"/>
</svg>
