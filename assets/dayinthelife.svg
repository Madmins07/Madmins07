<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A twenty four hour ring of a typical day: late Codeforces, six hours of sleep, lectures, Amoh and KDAG in the afternoon, research at night">
<style>
  .sans{font-family:-apple-system,'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{animation:spin 40s linear infinite}
  .spinr{animation:spinr 60s linear infinite}
  .scan{animation:scan 7s linear infinite}
  .float{animation:float 6s ease-in-out infinite alternate}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,26px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(60px,-34px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-140%)}to{transform:translateY(140%)}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
</style>
<defs>
  <clipPath id="df"><rect width="1000" height="330" rx="0"/></clipPath>
  <filter id="dglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dglow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dsoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="ddots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1C2032"/></pattern>
  <linearGradient id="dground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120d0a"/><stop offset="1" stop-color="#0d0f0d"/></linearGradient>
  <linearGradient id="dspine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A5C"/><stop offset="1" stop-color="#FFC14D"/></linearGradient>
  <linearGradient id="dspec" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#38E0FF"/><stop offset="0.33" stop-color="#8F5CFF"/><stop offset="0.67" stop-color="#FF4FD8"/><stop offset="1.00" stop-color="#FFC14D"/></linearGradient>
  <linearGradient id="dacc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9A5C"/><stop offset="1" stop-color="#FFC14D"/></linearGradient>
  <linearGradient id="daccv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A5C"/><stop offset="1" stop-color="#FF9A5C" stop-opacity="0"/></linearGradient>
  <linearGradient id="drule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9A5C"/><stop offset="1" stop-color="#FF9A5C" stop-opacity="0"/></linearGradient>
  <linearGradient id="dhair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9A5C" stop-opacity="0"/><stop offset=".5" stop-color="#FF9A5C"/><stop offset="1" stop-color="#FFC14D" stop-opacity="0"/></linearGradient>
  <linearGradient id="dfadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#120d0a"/><stop offset="1" stop-color="#120d0a" stop-opacity="0"/></linearGradient>
  <linearGradient id="dfadeR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#120d0a"/><stop offset="1" stop-color="#120d0a" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#df)">
<rect width="1000" height="330" fill="url(#dground)"/>
<rect width="1000" height="330" fill="url(#ddots)" opacity=".5"/>
<ellipse cx="250" cy="200" rx="170" ry="170" fill="#FF9A5C" opacity="0.16" filter="url(#dsoft)" class="drift2"/>
<rect x="39" y="0" width="2" height="330" fill="url(#dspine)" opacity=".55"/>
<circle cx="40" cy="52" r="9" fill="#07080D" stroke="#FF9A5C" stroke-width="1.5"/><circle cx="40" cy="52" r="3.5" fill="#FF9A5C" filter="url(#dglow)" class="pulse"/>
<text x="66" y="56" class="mono" font-size="11" fill="#FF9A5C" font-weight="700" letter-spacing="2">07</text>
<text x="96" y="56.5" class="mono" font-size="13.5" fill="#F3F5FF" font-weight="700" letter-spacing="2.6">A DAY AT THE DESK</text>
<rect x="96" y="66" width="0" height="1.5" fill="url(#drule)"><animate attributeName="width" values="0;180" begin=".3s" dur=".9s" fill="freeze"/></rect>
<text x="944" y="56" class="mono" font-size="9.5" fill="#6F7693" text-anchor="end" letter-spacing="2">IST  ·  SUBJECT TO DEADLINES</text>
<circle cx="250" cy="198" r="92" fill="none" stroke="#38E0FF" stroke-width="20" stroke-dasharray="0 578.1" stroke-dashoffset="0.0" transform="rotate(-90 250 198)" opacity=".92"><animate attributeName="stroke-dasharray" values="0 578.1;45.7 532.4" begin="0.30s" dur=".7s" fill="freeze"/></circle>
<circle cx="250" cy="198" r="92" fill="none" stroke="#1C2032" stroke-width="20" stroke-dasharray="0 578.1" stroke-dashoffset="-48.2" transform="rotate(-90 250 198)" opacity=".92"><animate attributeName="stroke-dasharray" values="0 578.1;142.0 436.0" begin="0.48s" dur=".7s" fill="freeze"/></circle>
<circle cx="250" cy="198" r="92" fill="none" stroke="#8F5CFF" stroke-width="20" stroke-dasharray="0 578.1" stroke-dashoffset="-192.7" transform="rotate(-90 250 198)" opacity=".92"><animate attributeName="stroke-dasharray" values="0 578.1;117.9 460.1" begin="0.66s" dur=".7s" fill="freeze"/></circle>
<circle cx="250" cy="198" r="92" fill="none" stroke="#FF4FD8" stroke-width="20" stroke-dasharray="0 578.1" stroke-dashoffset="-313.1" transform="rotate(-90 250 198)" opacity=".92"><animate attributeName="stroke-dasharray" values="0 578.1;21.6 556.5" begin="0.84s" dur=".7s" fill="freeze"/></circle>
<circle cx="250" cy="198" r="92" fill="none" stroke="#FF5FA8" stroke-width="20" stroke-dasharray="0 578.1" stroke-dashoffset="-337.2" transform="rotate(-90 250 198)" opacity=".92"><animate attributeName="stroke-dasharray" values="0 578.1;69.8 508.3" begin="1.02s" dur=".7s" fill="freeze"/></circle>
<circle cx="250" cy="198" r="92" fill="none" stroke="#FF9A5C" stroke-width="20" stroke-dasharray="0 578.1" stroke-dashoffset="-409.5" transform="rotate(-90 250 198)" opacity=".92"><animate attributeName="stroke-dasharray" values="0 578.1;45.7 532.4" begin="1.20s" dur=".7s" fill="freeze"/></circle>
<circle cx="250" cy="198" r="92" fill="none" stroke="#FFC14D" stroke-width="20" stroke-dasharray="0 578.1" stroke-dashoffset="-457.6" transform="rotate(-90 250 198)" opacity=".92"><animate attributeName="stroke-dasharray" values="0 578.1;117.9 460.1" begin="1.38s" dur=".7s" fill="freeze"/></circle>
<circle cx="250" cy="198" r="76.0" fill="none" stroke="#1C2032" stroke-dasharray="2 6"/>
<text x="250.0" y="139.5" class="mono" font-size="9.5" fill="#6F7693" text-anchor="middle" letter-spacing="1">00</text>
<text x="312.0" y="201.5" class="mono" font-size="9.5" fill="#6F7693" text-anchor="middle" letter-spacing="1">06</text>
<text x="250.0" y="263.5" class="mono" font-size="9.5" fill="#6F7693" text-anchor="middle" letter-spacing="1">12</text>
<text x="188.0" y="201.5" class="mono" font-size="9.5" fill="#6F7693" text-anchor="middle" letter-spacing="1">18</text>
<text x="250" y="204" class="sans" font-size="16" fill="#F3F5FF" font-weight="700" text-anchor="middle" letter-spacing="-.5">24h</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.3s" dur="0.5s" fill="freeze"/>
<rect x="420" y="90" width="10" height="10" rx="2.5" fill="#38E0FF"/><text x="442" y="100" class="mono" font-size="11" fill="#6F7693" letter-spacing="1">00:00</text>
<text x="500" y="100" class="sans" font-size="13.5" fill="#F3F5FF" font-weight="500">Codeforces, late problems</text>
<text x="944" y="100" class="mono" font-size="12" fill="#B9BFD6" text-anchor="end">2h</text>
<line x1="420" y1="110" x2="944" y2="110" stroke="#1C2032" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.42s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.42s" dur="0.5s" fill="freeze"/>
<rect x="420" y="120" width="10" height="10" rx="2.5" fill="#1C2032"/><text x="442" y="130" class="mono" font-size="11" fill="#6F7693" letter-spacing="1">02:00</text>
<text x="500" y="130" class="sans" font-size="13.5" fill="#F3F5FF" font-weight="500">Sleep, allegedly</text>
<text x="944" y="130" class="mono" font-size="12" fill="#B9BFD6" text-anchor="end">6h</text>
<line x1="420" y1="140" x2="944" y2="140" stroke="#1C2032" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.54s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.54s" dur="0.5s" fill="freeze"/>
<rect x="420" y="150" width="10" height="10" rx="2.5" fill="#8F5CFF"/><text x="442" y="160" class="mono" font-size="11" fill="#6F7693" letter-spacing="1">08:00</text>
<text x="500" y="160" class="sans" font-size="13.5" fill="#F3F5FF" font-weight="500">Lectures and labs</text>
<text x="944" y="160" class="mono" font-size="12" fill="#B9BFD6" text-anchor="end">5h</text>
<line x1="420" y1="170" x2="944" y2="170" stroke="#1C2032" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6599999999999999s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.6599999999999999s" dur="0.5s" fill="freeze"/>
<rect x="420" y="180" width="10" height="10" rx="2.5" fill="#FF4FD8"/><text x="442" y="190" class="mono" font-size="11" fill="#6F7693" letter-spacing="1">13:00</text>
<text x="500" y="190" class="sans" font-size="13.5" fill="#F3F5FF" font-weight="500">Mess, chai, walking</text>
<text x="944" y="190" class="mono" font-size="12" fill="#B9BFD6" text-anchor="end">1h</text>
<line x1="420" y1="200" x2="944" y2="200" stroke="#1C2032" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.78s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.78s" dur="0.5s" fill="freeze"/>
<rect x="420" y="210" width="10" height="10" rx="2.5" fill="#FF5FA8"/><text x="442" y="220" class="mono" font-size="11" fill="#6F7693" letter-spacing="1">14:00</text>
<text x="500" y="220" class="sans" font-size="13.5" fill="#F3F5FF" font-weight="500">Amoh, KDAG, projects</text>
<text x="944" y="220" class="mono" font-size="12" fill="#B9BFD6" text-anchor="end">3h</text>
<line x1="420" y1="230" x2="944" y2="230" stroke="#1C2032" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.8999999999999999s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.8999999999999999s" dur="0.5s" fill="freeze"/>
<rect x="420" y="240" width="10" height="10" rx="2.5" fill="#FF9A5C"/><text x="442" y="250" class="mono" font-size="11" fill="#6F7693" letter-spacing="1">17:00</text>
<text x="500" y="250" class="sans" font-size="13.5" fill="#F3F5FF" font-weight="500">Gym, music, offline</text>
<text x="944" y="250" class="mono" font-size="12" fill="#B9BFD6" text-anchor="end">2h</text>
<line x1="420" y1="260" x2="944" y2="260" stroke="#1C2032" opacity=".7"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.02s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1.02s" dur="0.5s" fill="freeze"/>
<rect x="420" y="270" width="10" height="10" rx="2.5" fill="#FFC14D"/><text x="442" y="280" class="mono" font-size="11" fill="#6F7693" letter-spacing="1">19:00</text>
<text x="500" y="280" class="sans" font-size="13.5" fill="#F3F5FF" font-weight="500">Research and backtests</text>
<text x="944" y="280" class="mono" font-size="12" fill="#B9BFD6" text-anchor="end">5h</text>
<line x1="420" y1="290" x2="944" y2="290" stroke="#1C2032" opacity=".7"/></g>
</g>
</svg>
