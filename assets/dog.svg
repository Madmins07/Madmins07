<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A golden retriever strolling across the top of the profile">
<defs>
  <clipPath id="dogFrame"><rect width="1000" height="140" rx="16"/></clipPath>
  <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2c885"/><stop offset="1" stop-color="#d59a45"/>
  </linearGradient>
  <linearGradient id="coatFar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9954a"/><stop offset="1" stop-color="#a5722c"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.55" stop-color="#0b0d10"/>
    <stop offset="1" stop-color="#040507"/>
  </radialGradient>
</defs>

<g clip-path="url(#dogFrame)">
  <rect width="1000" height="140" fill="#0b0d10"/>
  <rect width="1000" height="140" fill="url(#vig)"/>

  <line x1="28" y1="119" x2="972" y2="119" stroke="#1c2128" stroke-width="1"/>
  <g fill="#161b21">
    <circle cx="150" cy="125" r="1.6"/><circle cx="322" cy="127" r="1.4"/>
    <circle cx="505" cy="124" r="1.7"/><circle cx="688" cy="127" r="1.3"/>
    <circle cx="861" cy="125" r="1.5"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-260,0; 1220,0" dur="32s" repeatCount="indefinite"/>

    <g transform="scale(1.12)">

      <ellipse cx="105" cy="105" rx="66" ry="6" fill="#000000" opacity="0.4">
        <animate attributeName="rx" values="66;59;66" dur="0.34s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.29;0.4" dur="0.34s" repeatCount="indefinite"/>
      </ellipse>

      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,-2.4; 0,0" dur="0.34s" repeatCount="indefinite"/>

        <!-- far legs -->
        <g transform="translate(80,72)">
          <animateTransform attributeName="transform" type="rotate"
            values="17;-15;17" dur="0.68s" repeatCount="indefinite" additive="sum"/>
          <path d="M-5,-4 C-5,-8 5,-8 5,-4 L4,16 C4,20 5.4,23 7,24.6 L-7,24.6 C-5.4,23 -4,20 -4,16 Z" fill="url(#coatFar)"/>
          <ellipse cx="0" cy="25.4" rx="6.6" ry="3.4" fill="#b07c33"/>
        </g>
        <g transform="translate(136,72)">
          <animateTransform attributeName="transform" type="rotate"
            values="-15;17;-15" dur="0.68s" repeatCount="indefinite" additive="sum"/>
          <path d="M-5,-4 C-5,-8 5,-8 5,-4 L4,16 C4,20 5.4,23 7,24.6 L-7,24.6 C-5.4,23 -4,20 -4,16 Z" fill="url(#coatFar)"/>
          <ellipse cx="0" cy="25.4" rx="6.6" ry="3.4" fill="#b07c33"/>
        </g>

        <!-- plume tail -->
        <g transform="translate(48,54)">
          <animateTransform attributeName="transform" type="rotate"
            values="-12;14;-12" dur="0.37s" repeatCount="indefinite" additive="sum"/>
          <path d="M2,2 C-14,-2 -27,-11 -37,-26" fill="none" stroke="#d59a45"
                stroke-width="14" stroke-linecap="round"/>
          <ellipse cx="-22" cy="-13" rx="11" ry="9.5" fill="#e5ae5f" transform="rotate(-33 -22 -13)"/>
          <ellipse cx="-35" cy="-25" rx="10.5" ry="9" fill="#f0c682" transform="rotate(-45 -35 -25)"/>
          <path d="M0,1 C-13,-3 -25,-11 -34,-25" fill="none" stroke="#f7dda6"
                stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
        </g>

        <!-- body -->
        <path d="M44,60 C41,43 58,33 82,32 C108,31 131,37 142,48
                 C149,56 148,67 138,72 C122,81 87,82 63,77 C48,74 45,68 44,60 Z"
              fill="url(#coat)"/>
        <!-- cream underside -->
        <path d="M58,74 C82,81 116,81 137,72 C122,81 87,82 63,77 Z" fill="#f7e8c8" opacity="0.6"/>
        <!-- chest ruff -->
        <path d="M138,46 C147,52 149,62 141,70 C146,61 144,52 136,47 Z" fill="#f7e8c8" opacity="0.55"/>
        <!-- haunch -->
        <ellipse cx="66" cy="57" rx="19" ry="18" fill="#e9b96e" opacity="0.35"/>

        <!-- near legs -->
        <g transform="translate(69,72)">
          <animateTransform attributeName="transform" type="rotate"
            values="-15;17;-15" dur="0.68s" repeatCount="indefinite" additive="sum"/>
          <path d="M-5,-4 C-5,-8 5,-8 5,-4 L4,16 C4,20 5.4,23 7,24.6 L-7,24.6 C-5.4,23 -4,20 -4,16 Z" fill="url(#coat)"/>
          <ellipse cx="0" cy="25.4" rx="6.6" ry="3.4" fill="#f7dda6"/>
        </g>
        <g transform="translate(125,72)">
          <animateTransform attributeName="transform" type="rotate"
            values="17;-15;17" dur="0.68s" repeatCount="indefinite" additive="sum"/>
          <path d="M-5,-4 C-5,-8 5,-8 5,-4 L4,16 C4,20 5.4,23 7,24.6 L-7,24.6 C-5.4,23 -4,20 -4,16 Z" fill="url(#coat)"/>
          <ellipse cx="0" cy="25.4" rx="6.6" ry="3.4" fill="#f7dda6"/>
        </g>

        <!-- head -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 143,52; 3 143,52; 0 143,52" dur="0.68s" repeatCount="indefinite"/>
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="0 143,52; 0 143,52; 14 143,52; 16 143,52; 14 143,52; 0 143,52; 0 143,52"
              keyTimes="0; 0.30; 0.37; 0.43; 0.49; 0.56; 1"
              dur="7.5s" repeatCount="indefinite"/>

            <!-- neck -->
            <path d="M128,44 C136,34 152,31 162,38 L158,64 C144,69 132,60 128,52 Z" fill="url(#coat)"/>
            <!-- ear sits behind the skull, toward the back of the head -->
            <path d="M139,24 C149,21 155,31 154,43 C153,55 146,62 138,60
                     C130,58 128,47 129,36 C130,29 134,25 139,24 Z" fill="url(#coatFar)"/>
            <!-- skull -->
            <circle cx="157" cy="40" r="19" fill="url(#coat)"/>
            <!-- brow tuft -->
            <path d="M146,26 C153,20 164,21 170,27 C162,24 153,24 146,26 Z" fill="#f7dda6" opacity="0.7"/>
            <!-- muzzle -->
            <path d="M166,31 C180,28 195,34 198,42 C200,49 192,53 180,53 C169,53 164,46 164,39 Z" fill="#f7e8c8"/>
            <ellipse cx="197" cy="41" rx="5" ry="4.2" fill="#2b2118"/>
            <path d="M189,50 C192,52 196,52 198,50" fill="none" stroke="#cbab7c" stroke-width="1.3" stroke-linecap="round"/>
            <!-- eye, clear of the ear -->
            <ellipse cx="163" cy="34" rx="2.9" ry="2.9" fill="#2b2118">
              <animate attributeName="ry" values="2.9;2.9;0.3;2.9;2.9;2.9;0.3;2.9;2.9"
                       keyTimes="0;0.32;0.345;0.37;0.70;0.74;0.765;0.79;1"
                       dur="6.4s" repeatCount="indefinite"/>
            </ellipse>
            <circle cx="164.2" cy="32.8" r="1" fill="#ffffff" opacity="0.9"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</g>
<rect x="0.5" y="0.5" width="999" height="139" rx="16" fill="none" stroke="#1c2128"/>
</svg>
