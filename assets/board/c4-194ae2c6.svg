<text x="460" y="104" class="mono" font-size="10" fill="#79819A" letter-spacing="2.4">HOW TO PLAY</text>
<text x="460" y="124" class="sans" font-size="11" fill="#ADB5C7">Click a column number under the board. It opens a pre-filled issue; press Create.</text>
<text x="460" y="140" class="sans" font-size="11" fill="#ADB5C7">A GitHub Action plays your move, the bot answers, and the board redraws in ~20 s.</text>
<text x="460" y="156" class="sans" font-size="11" fill="#ADB5C7">Four in a row wins. Anyone can move; you can play a whole game alone.</text>
