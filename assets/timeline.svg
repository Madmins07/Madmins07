  <text x="500" y="70" text-anchor="middle" class="sans" font-size="16.5" font-weight="700" fill="#f0eae0">PharmEasy</text>
  <text x="500" y="88" text-anchor="middle" class="sans" font-size="12.5" fill="#9aa4b2">Summer Intern</text>
  <text x="500" y="104" text-anchor="middle" class="sans" font-size="11.5" fill="#5f6875">Bangalore, ten weeks</text></g>
<circle cx="500" cy="150" r="7" fill="#0b0d10" stroke="#e0b170" stroke-width="2.4" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="1.19s" dur="0.4s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.56s" dur="0.55s" fill="freeze"/>
  <line x1="684" y1="160" x2="684" y2="170" stroke="#232a33"/>
  <text x="684" y="190" text-anchor="middle" class="mono" font-size="10.5" fill="#e0b170" letter-spacing="1.6">2025-26</text>
  <text x="684" y="212" text-anchor="middle" class="sans" font-size="16.5" font-weight="700" fill="#f0eae0">KDAG</text>
  <text x="684" y="230" text-anchor="middle" class="sans" font-size="12.5" fill="#9aa4b2">Executive Head</text>
  <text x="684" y="246" text-anchor="middle" class="sans" font-size="11.5" fill="#5f6875">curriculum and projects</text></g>
<circle cx="684" cy="150" r="7" fill="#0b0d10" stroke="#e0b170" stroke-width="2.4" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="1.41s" dur="0.4s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.78s" dur="0.55s" fill="freeze"/>
  <line x1="868" y1="140" x2="868" y2="102" stroke="#232a33"/>
  <text x="868" y="48" text-anchor="middle" class="mono" font-size="10.5" fill="#79d4a7" letter-spacing="1.6">2026-27</text>
  <text x="868" y="70" text-anchor="middle" class="sans" font-size="16.5" font-weight="700" fill="#f0eae0">KDAG</text>
  <text x="868" y="88" text-anchor="middle" class="sans" font-size="12.5" fill="#9aa4b2">Advisor</text>
  <text x="868" y="104" text-anchor="middle" class="sans" font-size="11.5" fill="#5f6875">current</text></g>
<circle cx="868" cy="150" r="7" fill="#0b0d10" stroke="#79d4a7" stroke-width="2.4" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="1.63s" dur="0.4s" fill="freeze"/></circle><circle cx="868" cy="150" r="7" fill="none" stroke="#79d4a7" opacity="0">
  <animate attributeName="r" values="7;19" begin="2.6s" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.8;0" begin="2.6s" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="44" y="286" class="mono" font-size="11" fill="#3f4854" letter-spacing="2.4">TRACK RECORD</text>
</g>
<rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#1c2128"/>
</svg>