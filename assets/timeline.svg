  <text x="132" y="70" text-anchor="middle" class="sans" font-size="16.5" font-weight="700" fill="#f0eae0">Seventh Triangle</text>
  <text x="132" y="88" text-anchor="middle" class="sans" font-size="12.5" fill="#9aa4b2">Research and Development Intern</text>
  <text x="132" y="104" text-anchor="middle" class="sans" font-size="11.5" fill="#5f6875">four months</text></g>
<circle cx="132" cy="150" r="7" fill="#0b0d10" stroke="#e0b170" stroke-width="2.4" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="0.75s" dur="0.4s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.12s" dur="0.55s" fill="freeze"/>
  <line x1="316" y1="160" x2="316" y2="170" stroke="#232a33"/>
  <text x="316" y="190" text-anchor="middle" class="mono" font-size="10.5" fill="#e0b170" letter-spacing="1.6">SEP 2024</text>
  <text x="316" y="212" text-anchor="middle" class="sans" font-size="16.5" font-weight="700" fill="#f0eae0">Myntra</text>
  <text x="316" y="230" text-anchor="middle" class="sans" font-size="12.5" fill="#9aa4b2">Strategy Intern</text>
  <text x="316" y="246" text-anchor="middle" class="sans" font-size="11.5" fill="#5f6875">brand launch, go to market</text></g>
<circle cx="316" cy="150" r="7" fill="#0b0d10" stroke="#e0b170" stroke-width="2.4" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="0.97s" dur="0.4s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.34s" dur="0.55s" fill="freeze"/>
  <line x1="500" y1="140" x2="500" y2="102" stroke="#232a33"/>
