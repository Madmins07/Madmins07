<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline from Seventh Triangle and Myntra in 2024, through PharmEasy in 2025, to KDAG Advisor in 2026">
<style>
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
  .sans{font-family:ui-sans-serif,-apple-system,'Helvetica Neue','Segoe UI',Arial,sans-serif}
</style>
<defs><clipPath id="tFrame"><rect width="1000" height="300" rx="16"/></clipPath></defs>
<g clip-path="url(#tFrame)">
  <rect width="1000" height="300" fill="#0b0d10"/>
  <line x1="76" y1="150" x2="924" y2="150" stroke="#1c2128" stroke-width="2"/>
  <line x1="76" y1="150" x2="924" y2="150" stroke="#a8834f" stroke-width="2"
        stroke-dasharray="848" stroke-dashoffset="848">
    <animate attributeName="stroke-dashoffset" values="848;0" begin="0.3s" dur="1.8s" fill="freeze"/></line>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.90s" dur="0.55s" fill="freeze"/>
  <line x1="132" y1="140" x2="132" y2="102" stroke="#232a33"/>
